<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملاحظاتي</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:white;margin:0;padding:16px}
h1{text-align:center}
input,textarea{width:100%;padding:12px;border-radius:12px;border:none;margin-bottom:10px;font-size:16px}
textarea{height:90px}
button{width:100%;padding:13px;background:#22c55e;color:white;border:none;border-radius:12px;font-size:18px;font-weight:bold}
.note{background:#1e293b;padding:14px;border-radius:14px;margin-top:12px}
.del{background:#ef4444;margin-top:8px;padding:8px;font-size:14px}
</style>
</head>
<body>
<h1>📝 ملاحظاتي</h1>
<input id="title" placeholder="عنوان الملاحظة...">
<textarea id="text" placeholder="اكتب ملاحظتك هنا..."></textarea>
<button onclick="save()">+ حفظ الملاحظة</button>
<div id="list"></div>
<script>
let notes = JSON.parse(localStorage.getItem('notes')||'[]');
function show(){
  document.getElementById('list').innerHTML = notes.map((n,i)=>`<div class="note"><b>${n.title}</b><p>${n.text}</p><button class="del" onclick="del(${i})">حذف</button></div>`).join('');
}
function save(){
  let t=document.getElementById('title').value;
  let x=document.getElementById('text').value;
  if(!t && !x) return alert('اكتب حاجة أول!');
  notes.unshift({title:t||'بدون عنوان',text:x});
  localStorage.setItem('notes',JSON.stringify(notes));
  document.getElementById('title').value='';document.getElementById('text').value='';
  show();
}
function del(i){notes.splice(i,1);localStorage.setItem('notes',JSON.stringify(notes));show();}
show();
</script>
</body>
</html>
